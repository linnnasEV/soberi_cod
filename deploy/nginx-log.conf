# Отдельный журнал обращений, в котором видно, какой адрес пришёл от хостинга.
#
# Зачем он нужен. Сервер стоит за общим шлюзом провайдера, и в обычном журнале
# у всех посетителей один и тот же внутренний адрес. Настоящий адрес может
# приходить в заголовке — у разных хостингов это X-Forwarded-For или
# X-Real-IP, — а может не приходить вовсе. Этот журнал показывает оба, и по
# нему видно, есть ли что восстанавливать.
#
# Файл кладётся отдельно, а не в конфиг сайта, нарочно: конфиг сайта правил
# certbot, когда выписывал сертификат, и переписывать его целиком нельзя.
#
# Установка:
#   sudo cp deploy/nginx-log.conf /etc/nginx/conf.d/soberikod-log.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Посмотреть:
#   sudo tail -5 /var/log/nginx/soberikod.log
#
# Если в поле xff= или real= окажется настоящий адрес посетителя — скажите,
# я включу его подстановку, и счёт попыток по адресу снова заработает.
# Если там прочерки — адрес теряется у провайдера, и защитой остаётся
# запирание конкретного аккаунта.

log_format soberikod '$remote_addr xff=$http_x_forwarded_for real=$http_x_real_ip '
                     '"$request" $status "$http_user_agent"';

access_log /var/log/nginx/soberikod.log soberikod;
