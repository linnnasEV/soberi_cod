# Защитные заголовки. Лежат отдельным файлом из-за особенности nginx:
# add_header не наследуется в блок location, если внутри этого блока есть
# хотя бы один свой add_header. То есть стоило бы прописать заголовки один раз
# на весь сервер — и они бы молча исчезли со страниц, где настраивается кэш,
# то есть именно с index.html. Поэтому файл подключается include в каждый блок.
#
# Ставится так:
#   sudo install -d -m 755 /etc/nginx/snippets
#   sudo cp deploy/nginx-headers.conf /etc/nginx/snippets/soberikod-headers.conf

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;

# 'unsafe-inline' в script-src стоит здесь не от лени: в index.html обработчики
# написаны прямо в разметке (onclick="..."), и строгая политика сломала бы весь
# сайт. Перевод обработчиков в js/ — отдельная задача; после неё эту строчку
# нужно сократить до script-src 'self', и только тогда политика начнёт всерьёз
# защищать от подстановки чужого скрипта.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
