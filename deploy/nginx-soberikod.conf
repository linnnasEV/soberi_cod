# Сайт и API «СобериКод» на одном домене.
#
# Один домен — не удобство, а требование безопасности. Только так cookie сессии
# отдаётся с флагом httpOnly, и тогда её не достанет ни один скрипт на странице.
# Если раздавать сайт с одного адреса, а API с другого, ключ входа пришлось бы
# держать в localStorage, откуда его уводит любая дырка в вёрстке.
#
# Домен записан в ASCII-виде: соберикод.рф — это xn--90agcmkuenf.xn--p1ai.
# Кириллицу nginx в server_name не понимает, в адресной строке её подставит
# сам браузер.
#
# Установка:
#   sudo cp deploy/nginx-soberikod.conf /etc/nginx/sites-available/soberikod
#   sudo ln -s /etc/nginx/sites-available/soberikod /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Затем сертификат — certbot допишет в этот файл блок TLS и перенаправление с http:
#   sudo certbot --nginx -d xn--90agcmkuenf.xn--p1ai -d www.xn--90agcmkuenf.xn--p1ai
#
# ВАЖНО, после выпуска сертификата: на сервере этот файл уже не совпадает с тем,
# что лежит в репозитории — certbot дописал в него пути к сертификату и переход
# с http на https. Копировать его поверх живого нельзя, иначе сайт останется
# без TLS. Мелкие правки вносите прямо в /etc/nginx/sites-available/soberikod,
# а здесь повторяйте, чтобы два файла не разъезжались.

# Ограничение частоты запросов к входу. Директива стоит вне server, потому что
# счётчик общий для всего сервера.
#
# Числа выбраны под то, что сервер стоит за общим шлюзом провайдера и видит
# всех посетителей под одним адресом. Поэтому это не «сколько можно одному
# человеку», а «сколько можно всем сразу»: класс из двадцати пяти детей,
# входящих на перемене, должен пройти не споткнувшись. Отсюда запас в 60
# запросов и дальше по одному в секунду — поток перебора это придавит,
# живым людям не помешает.
#
# Настоящая защита от подбора пароля не здесь, а в сервере: конкретный аккаунт
# запирается после десяти неудачных попыток, и от адреса это не зависит.
limit_req_zone $binary_remote_addr zone=soberikod_auth:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name xn--90agcmkuenf.xn--p1ai www.xn--90agcmkuenf.xn--p1ai;

    root /var/www/soberikod;
    index index.html;
    charset utf-8;

    # Версию nginx посторонним знать незачем.
    server_tokens off;

    # Больше килобайта браузер не присылает: самая большая посылка — работа
    # из Мастерской. Ограничение отсекает попытки залить в сервер что-то чужое.
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ===== Вход: отдельный блок только ради ограничения частоты =====
    location /api/auth/ {
        limit_req zone=soberikod_auth burst=60 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        include snippets/soberikod-headers.conf;
    }

    # ===== Всё остальное API =====
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        include snippets/soberikod-headers.conf;
    }

    # ===== Страница и сервис-воркер: никогда из кэша =====
    # В проекте заведён порядок: файлы в js/ и css/ подключаются с ?v=NN, и
    # версия поднимается при каждой правке. Чтобы этот порядок работал, сама
    # страница и сервис-воркер должны приходить свежими — иначе браузер будет
    # бесконечно просить старые версии файлов.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/soberikod-headers.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include snippets/soberikod-headers.conf;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        include snippets/soberikod-headers.conf;
    }

    # ===== Остальная статика: кэш надолго, обновление через ?v=NN =====
    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        include snippets/soberikod-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
        include snippets/soberikod-headers.conf;
    }

    # Служебные файлы наружу не отдаём ни при каких условиях. В /var/www их и
    # не должно быть — скрипт обновления копирует только сайт, — но пусть
    # запрет стоит: ошибка в скрипте не должна превращаться в утечку.
    location ~ /\. {
        deny all;
    }
}
